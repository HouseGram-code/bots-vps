services:
  vps-bot:
    build: .
    image: vps-telegram-bot:latest
    container_name: vps-telegram-bot
    restart: unless-stopped
    # .env.example всегда есть в репозитории — создавать .env на сервере не нужно.
    # Если .env всё-таки создадите, он подхватится и перекроет значения.
    env_file:
      - .env.example
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    working_dir: /app
    # На LXC-хостах AppArmor ломает runc — выставь LXC_MODE=1 в .env.example
    # (если не задано, бот определит LXC автоматически)
    security_opt:
      - apparmor=unconfined
